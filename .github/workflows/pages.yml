name: Publicar simulador en GitHub Pages

on:
  push:
    branches: [master]
    paths: ["app/**", "contenido/**", "index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validar.mjs
      # Solo se publica la app y el contenido; los PDFs se abren desde GitHub (ver app/js/datos.js → urlArchivo).
      - name: Armar sitio
        run: |
          mkdir -p _site
          cp -r app contenido index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
